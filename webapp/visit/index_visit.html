<style>
  :root {
    --bg1: #0f172a; --bg2: #1e1b4b; --accent: #6366f1; --accent2: #8b5cf6;
    --glass: rgba(255,255,255,0.08); --glass-b: rgba(255,255,255,0.14);
    --success: #10b981; --danger: #ef4444; --warn: #f59e0b;
  }
  @font-face { font-family: 'Vazir'; src: url('/Font/Vazir-Regular.woff2') format('woff2'); font-weight: normal; }
  @font-face { font-family: 'Vazir'; src: url('/Font/Vazir-Bold.woff2') format('woff2'); font-weight: bold; }
  @font-face { font-family: 'Vazir'; src: url('/Font/Vazir-Black.woff2') format('woff2'); font-weight: 900; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, select, input { font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif; }
  html, body { margin: 0; padding: 0; min-height: 100%; overscroll-behavior: contain; }
  body {
    font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 20% 0%, #312e81 0%, var(--bg1) 45%, #020617 100%);
    color: #f1f5f9; min-height: 100vh; padding: 16px 16px 40px;
  }
  .hero { background: var(--glass); border: 1px solid var(--glass-b); border-radius: 20px; padding: 18px; margin-bottom: 18px; }
  .hero .greet { font-size: 13px; color: #cbd5e1; }
  .hero .name { font-size: 19px; font-weight: 900; margin-top: 2px; }
  .hero .nid { font-size: 11px; color: #94a3b8; direction: ltr; text-align: right; margin-top: 2px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .back-btn { background: rgba(255,255,255,.08); border: 1px solid var(--glass-b); border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .app-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--glass); border: 1px solid var(--glass-b); border-radius: 16px; padding: 10px 14px; margin: 24px 0 10px; }
  .app-footer img { height: 24px; width: auto; opacity: .9; }
  .app-footer .footer-text { flex: 1; text-align: center; font-size: 9px; color: #94a3b8; line-height: 1.7; }
  .app-footer .footer-text b { color: #a5b4fc; }
  h2.section-title { font-size: 14px; font-weight: 800; margin: 22px 0 12px; color: #a5b4fc; }
  .req-card { background: var(--glass); border: 1px solid var(--glass-b); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .req-card.hl { border-color: #fcd34d; box-shadow: 0 0 0 3px rgba(252,211,77,.25); }
  .req-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .req-type { font-size: 14px; font-weight: 900; }
  .req-code { font-size: 10px; color: #64748b; direction: ltr; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 11.5px; margin: 8px 0 12px; }
  .kv span { color: #94a3b8; }
  .kv b { color: #e2e8f0; font-weight: 700; text-align: left; }
  .progress { height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; margin: 10px 0 4px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #fcd34d); border-radius: 6px; }
  .prog-lbl { font-size: 10.5px; color: #fcd34d; margin-bottom: 12px; }
  .action-row { display: flex; gap: 10px; margin-top: 4px; }
  .action-btn { flex: 1; border: 1px solid transparent; border-radius: 14px; padding: 12px 8px; font-size: 12.5px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; }
  .action-btn .sub { font-size: 10px; font-weight: 600; opacity: .9; }
  .action-btn.awaiting { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1c1917; box-shadow: 0 6px 18px rgba(245,158,11,.3); }
  .action-btn.fix { background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.5); color: #fecaca; }
  .action-btn.received { background: rgba(134,239,172,.14); border-color: rgba(134,239,172,.45); color: #bbf7d0; cursor: default; }
  .action-btn.approved { background: rgba(96,165,250,.15); border-color: rgba(96,165,250,.5); color: #bfdbfe; cursor: default; }
  .action-btn.locked { background: rgba(255,255,255,.06); color: #94a3b8; border-color: rgba(255,255,255,.12); cursor: default; }
  .action-btn.na { display: none; }
  .action-btn.appt { background: rgba(56,189,248,.14); color: #7dd3fc; }
  .appt-hint { font-size: 11px; line-height: 1.9; color: #bae6fd; background: rgba(56,189,248,.10); border: 1px solid rgba(56,189,248,.28); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 8px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-b); border-radius: 16px; padding: 5px; margin-bottom: 16px; }
  .tab { flex: 1; border: 0; border-radius: 12px; padding: 11px 6px; font-size: 12.5px; font-weight: 800; color: #cbd5e1; background: transparent; cursor: pointer; font-family: inherit; }
  .tab.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .tab .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: rgba(255,255,255,.2); font-size: 10.5px; margin-right: 4px; }
  h2.section-title { font-size: 13.5px; font-weight: 900; margin: 6px 0 12px; color: #c7d2fe; display: flex; align-items: center; gap: 6px; }
  h2.section-title + .req-card { margin-top: 0; }
  .sec { margin-bottom: 22px; }
  .doc-rows { margin-top: 12px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px; }
  .doc-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid; }
  .doc-row:last-child { margin-bottom: 0; }
  .doc-row .t { flex: 1; min-width: 0; }
  .doc-row .t b { display: block; font-size: 12px; color: #f1f5f9; }
  .doc-row .t small { display: block; font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .doc-row.PENDING { background: rgba(134,239,172,.08); border-color: rgba(134,239,172,.35); }
  .doc-row.APPROVED { background: rgba(96,165,250,.1); border-color: rgba(96,165,250,.4); }
  .doc-row.REJECTED { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.4); }
  .doc-row.none { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.35); }
  .view-btn { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 800; cursor: pointer; text-decoration: none; white-space: nowrap; font-family: inherit; }
  .closed-banner { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(135deg, rgba(245,158,11,.16), rgba(239,68,68,.1)); border: 1px solid rgba(245,158,11,.45); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; font-size: 12px; line-height: 2; color: #fde68a; }
  .closed-banner .ic { font-size: 26px; animation: cbSwing 2.4s ease-in-out infinite; }
  @keyframes cbSwing { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .btn { border: none; border-radius: 16px; padding: 14px 18px; font-size: 14px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-outline { background: rgba(255,255,255,.08); color: #e2e8f0; border: 1px solid var(--glass-b); }
  .empty-state { text-align: center; padding: 28px 16px; color: #94a3b8; font-size: 12.5px; line-height: 2; background: var(--glass); border: 1px dashed var(--glass-b); border-radius: 18px; }
  .empty-state .big { font-size: 34px; display: block; margin-bottom: 6px; }
  .spinner { text-align: center; padding: 24px; color: #64748b; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>

    <a class="back-btn" id="back-to-app-link" href="#" title="بازگشت به پنل اصلی">🏠</a>

</div>

<div id="closed-banner"></div>

<div id="requests-section" style="display:none;">
  <div class="tabs">
    <button class="tab on" data-tab="awaiting" onclick="setTab('awaiting')">🟡 در انتظار بارگزاری <span class="n" id="n-awaiting">۰</span></button>

<div class="app-footer">

        <div>طراحی و توسعه سیستم: <b>گروه توسعه بهیکس</b> <span style="font-family:Arial,sans-serif;">(MMBehzadi)</span></div>
        <div>تمامی حقوق مادی و معنوی سیستم محفوظ می‌باشد - ۲۰۲۶ ©</div>

</div>

<div class="toast" id="toast"></div>

<script src="../mini-kit.js?v=5"></script>
<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('t') || '';
const FOCUS_CASE = params.get('case') || '';
const API = '/api/webapp_visit.php';
// نامِ «K» عمداً نیست: اسکریپتِ خودِ بله (miniapp.js) متغیرِ سراسریِ K دارد و «const K» کلِ این اسکریپت را از کار می‌انداخت
const MKIT = window.MiniKit;

function toFa(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function formatPlateHtml(plate) {
    if (!plate) return '';
    { const _mp = String(plate).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).match(/^\s*(\d{3})\s*-\s*(\d{5})\s*$/);   // پلاکِ موتورسیکلت
      if (_mp) { const _f = x => x.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); return `<span class="mt-plate"><span class="flag"></span><span class="mt-n"><b>${_f(_mp[1])}</b><span>${_f(_mp[2])}</span></span><span class="mt-ic">🏍</span></span>`; } }
    const m = String(plate).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).match(/^\s*(\d{2})\s*ایران\s*-?\s*(\d{3})\s*(\S+?)\s*(\d{2})\s*$/);
    if (!m) return esc(plate);
    const [, region, suffix, letter, prefix] = m;
    return `<span class="ir-plate"><span class="flag"></span><span>${toFa(prefix)}</span><span>${letter}</span><span>${toFa(suffix)}</span><span class="ir"><small>ایران</small>${toFa(region)}</span></span>`;
}

let ROWS = [], TAB = 'awaiting', HOURS = null, APPT_HINT = '';

async function init() {
    const backLink = document.getElementById('back-to-app-link');
    try {
        const data = await (await fetch(`${API}?action=init&token=${encodeURIComponent(TOKEN)}`)).json();
        if (data.is_guest) {
            document.getElementById('user-name').textContent = 'کاربر مهمان';
            document.getElementById('guest-box').style.display = 'block';
            backLink.style.display = 'none';
            return;
        }
        document.getElementById('user-name').textContent = data.person_name;
        document.getElementById('user-nid').textContent = data.national_code ? toFa(data.national_code) : '';
        document.getElementById('requests-section').style.display = 'block';
        backLink.href = `../app/?t=${encodeURIComponent(TOKEN)}`;
        if (params.get('tab') === 'uploaded') TAB = 'uploaded';
        loadRequests();
    } catch(e) { document.getElementById('user-name').textContent = 'خطا در اتصال به سرور'; }
}

function renderClosed() {
    const el = document.getElementById('closed-banner');
    if (!HOURS || HOURS.open) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="closed-banner"><span class="ic">⏰</span><div><b>الان خارج از ساعتِ کاری است؛ ارسالِ مدارک بسته است.</b><br>${HOURS.next ? 'زمانِ بعدی: <b>' + esc(HOURS.next) + '</b><br>' : ''}وضعیتِ مدارکِ ارسال‌شده را همین‌جا می‌توانید ببینید.</div></div>`;
}

async function loadRequests() {
    const box = document.getElementById('requests-list');
    box.innerHTML = '<div class="spinner">در حال بارگذاری...</div>';
    try {
        const data = await (await fetch(`${API}?action=my_requests&token=${encodeURIComponent(TOKEN)}`)).json();
        if (!data.ok) { box.innerHTML = `<div class="empty-state">${esc(data.error)}</div>`; return; }
        ROWS = data.data || []; HOURS = data.hours || null; APPT_HINT = data.appt_hint || '';
        renderClosed();
        // آمدن از «ثبتِ درخواست» با ?case=: اگر مدارکِ همان درخواست مانده، مستقیم صفحه‌ی ارسال باز می‌شود
        if (FOCUS_CASE) {
            const r = ROWS.find(x => String(x.id) === String(FOCUS_CASE));
            if (r && ['not_started', 'partial', 'needs_fix'].includes(r.docs_status) && (!HOURS || HOURS.open)) { location.replace(docsUrl(r.id)); return; }
        }
        render();
    } catch(e) { box.innerHTML = '<div class="empty-state">خطا در اتصال به سرور.</div>'; }
}

function setTab(t) { TAB = t; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function detailRows(r) {
    const rows = [];
    if (r.kind_fa || r.car_system) rows.push(['وسیله', [r.kind_fa, r.car_system].filter(Boolean).join(' · ')]);
    if (r.no_plate && r.chassis_num) rows.push(['شماره شاسی', r.chassis_num]);
    if (r.insured_name) rows.push(['بیمه‌گذار', r.insured_name + (r.insured_relationship && r.insured_relationship !== 'خودم' ? ` (${r.insured_relationship})` : '')]);
    if (r.insurance_type === 'THIRDPARTY' && r.liability_limit) rows.push(['سقف تعهد مالی', toFa((r.liability_limit / 10).toLocaleString('en-US')) + ' تومان']);
    if (r.insurance_type === 'BODY') rows.push(['ارزش خودرو', r.estimated_car_value > 0 ? toFa(Number(r.estimated_car_value).toLocaleString('en-US')) + ' تومان' : 'محاسبه توسط کارشناس']);
    if (r.created_j) rows.push(['تاریخ ثبت', r.created_j]);
    return `<div class="kv">${rows.map(([k, v]) => `<span>${k}</span><b>${esc(v)}</b>`).join('')}</div>`;
}
function head(r) {
    return `<div class="req-head"><span class="req-type">${r.kind_icon || '🚗'} ${esc(r.type_fa)}</span>${formatPlateHtml(r.plate)}<span class="req-code">${esc(r.unique_code)}</span></div>`;
}

function awaitingCard(r) {
    const closed = HOURS && !HOURS.open;
    const docsNeed = ['not_started', 'partial', 'needs_fix'].includes(r.docs_status);
    const pct = r.docs_total ? Math.round(r.docs_sent / r.docs_total * 100) : 0;
    let docsBtn;
    if (docsNeed) docsBtn = closed
        ? `<button class="action-btn locked" onclick="showToast('خارج از ساعتِ کاری؛ ارسالِ مدارک بسته است.')"><span>🔒 بارگزاری مدارک</span><span class="sub">در ساعتِ کاری</span></button>`
        : `<button class="action-btn ${r.docs_status === 'needs_fix' ? 'fix' : 'awaiting'}" onclick="goDocs(${r.id})"><span>${r.docs_status === 'needs_fix' ? '⚠️' : '📎'} بارگزاری مدارک</span><span class="sub">${r.docs_status === 'needs_fix' ? 'مدرکی نیاز به اصلاح دارد' : 'در انتظار بارگزاری'}</span></button>`;
    else docsBtn = `<button class="action-btn ${r.docs_status === 'approved' ? 'approved' : 'received'}"><span>${r.docs_status === 'approved' ? '🔵' : '🟢'} مدارک</span><span class="sub">${r.docs_status === 'approved' ? 'تایید شده' : 'دریافت شد · در انتظار تایید'}</span></button>`;
    let healthBtn = '';
    if (r.health_status !== 'not_applicable') {
        if (r.appointment && r.appointment.can_pick) healthBtn = r.appointment.need_pick
            ? `<button class="action-btn awaiting" onclick="pickAppt(${r.id})"><span>🗓 انتخابِ زمانِ بازدید</span><span class="sub">${r.appointment.past ? 'زمانِ قبلی گذشت؛ دوباره انتخاب کنید' : 'نوبت‌های آزادِ روزهای پیشِ رو'}</span></button>`
            : `<button class="action-btn appt" onclick="pickAppt(${r.id})"><span>🗓 بازدیدِ خودرو (حضوری)</span><span class="sub">${esc(r.appointment.slot_fa || '')} · تغییر</span></button>`;
        else if (r.appointment) healthBtn = `<button class="action-btn appt" onclick="showToast('نوبتِ بازدیدِ حضوری: ' + (this.dataset.slot || 'به‌زودی اعلام می‌شود'))" data-slot="${esc(r.appointment.slot_fa || '')}"><span>🗓 بازدید خودرو (حضوری)</span><span class="sub">${esc(r.appointment.slot_fa || 'نوبت به‌زودی اعلام می‌شود')}</span></button>`;
        else if (['not_started', 'needs_fix'].includes(r.health_status)) {
            const ready = !docsNeed;
            healthBtn = !ready ? `<button class="action-btn locked"><span>🚗 بازدید خودرو</span><span class="sub">بعد از ارسالِ مدارک</span></button>`
                : closed ? `<button class="action-btn locked" onclick="showToast('خارج از ساعتِ کاری.')"><span>🔒 بازدید خودرو</span><span class="sub">در ساعتِ کاری</span></button>`
                : `<button class="action-btn ${r.health_status === 'needs_fix' ? 'fix' : 'awaiting'}" onclick="goHealth(${r.id})"><span>🚗 بازدید خودرو</span><span class="sub">${r.health_status === 'needs_fix' ? 'نیاز به اصلاح' : 'در انتظار انجام'}</span></button>`;
        } else healthBtn = `<button class="action-btn ${r.health_status === 'approved' ? 'approved' : 'received'}"><span>🚗 بازدید خودرو</span><span class="sub">${r.health_status === 'approved' ? 'تایید شده' : 'در انتظار تایید'}</span></button>`;
    }
    const reason = r.health_status === 'needs_fix' && r.health_reject_reason && !r.appointment ? `<p style="font-size:10.5px;color:#fca5a5;margin:8px 0 0;">علت اصلاح بازدید: ${esc(r.health_reject_reason)}</p>` : '';
    return `<div class="req-card ${String(r.id) === String(FOCUS_CASE) ? 'hl' : ''}" id="case-${r.id}">
        ${head(r)}
        ${MKIT.stagePill(r.stage)}
        ${detailRows(r)}
        ${docsNeed ? `<div class="progress"><i style="width:${pct}%"></i></div><div class="prog-lbl">${toFa(r.docs_sent)} از ${toFa(r.docs_total)} مدرک ارسال شده</div>` : ''}
        <div class="action-row">${docsBtn}${healthBtn}</div>
        ${reason}
        ${visitNote(r)}
    </div>`;
}
// «صدورِ بیمه‌نامه منوط به انجامِ بازدیدِ خودرو می‌باشد» برای بدنه‌ای که بازدیدش هنوز تایید نشده
function visitNote(r) {
    return r.visit_required ? `<p style="font-size:11px;line-height:1.9;color:#fde68a;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:6px 10px;margin:8px 0 0;">⚠️ صدورِ بیمه‌نامه منوط به انجامِ بازدیدِ خودرو می‌باشد.</p>` : '';
}
function pickAppt(caseId) {
    const r = ROWS.find(x => String(x.id) === String(caseId));
    MiniKit.apptPicker({ api: API, token: TOKEN, caseId: caseId, plate: r && r.plate, onDone: d => { showToast('✅ نوبت ثبت شد: ' + d.slot_fa); loadRequests(); } });
}

const DOC_ST = { PENDING: '🟢 دریافت شد · در انتظار تایید کارشناس', APPROVED: '🔵 تایید شده', REJECTED: '🔴 رد شده' };
function uploadedCard(r) {
    const docs = (r.docs || []).map(d => `<div class="doc-row ${d.status || 'none'}">
        <div class="t"><b>${esc(d.label)}</b><small>${d.status ? DOC_ST[d.status] : '🟡 ارسال نشده'}${d.uploaded_j ? ' · ' + esc(d.uploaded_j) : ''}</small>
        ${d.status === 'REJECTED' && d.reject_reason ? `<small style="color:#fca5a5;">علت: ${esc(d.reject_reason)}</small>` : ''}</div>
        ${d.doc_id ? `<a class="view-btn" href="${API}?action=doc_file&token=${encodeURIComponent(TOKEN)}&id=${d.doc_id}" target="_blank" rel="noopener">${d.is_pdf ? '📄' : '🖼'} مشاهده</a>` : ''}
    </div>`).join('');
    return `<div class="req-card">
        ${head(r)}
        ${MKIT.stagePill(r.stage)}
        ${MKIT.stages(r.stage)}
        ${detailRows(r)}
        <div class="doc-rows">${docs || '<div class="empty-state" style="padding:12px;">مدرکی ثبت نشده.</div>'}</div>
        ${visitNote(r)}
        ${r.stage === 'issued' ? `<button class="btn btn-primary" onclick="location.href='../app/?t=${encodeURIComponent(TOKEN)}&open=policies'">📁 دانلود از بیمه‌نامه‌های من</button>` : ''}
    </div>`;
}

function render() {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
    const awaiting = ROWS.filter(r => r.awaiting), uploaded = ROWS.filter(r => !r.awaiting);
    document.getElementById('n-awaiting').textContent = toFa(awaiting.length);
    document.getElementById('n-uploaded').textContent = toFa(uploaded.length);
    const list = TAB === 'awaiting' ? awaiting : uploaded;
    const box = document.getElementById('requests-list');
    if (!list.length) {
        box.innerHTML = TAB === 'awaiting'
            ? '<div class="empty-state"><span class="big">✅</span>درخواستی در انتظارِ بارگزاریِ مدارک ندارید.<br>وضعیتِ مدارکِ ارسال‌شده در «مدارک بارگزاری شده» است.</div>'
            : '<div class="empty-state"><span class="big">📂</span>هنوز مدارکِ هیچ درخواستی کامل ارسال نشده است.</div>';
        return;
    }
    const card = TAB === 'awaiting' ? awaitingCard : uploadedCard;
    // مسیرِ ثالث و بدنه جدا
    const sec = (type, title) => { const l = list.filter(r => r.insurance_type === type); return l.length ? `<div class="sec"><h2 class="section-title">${title} <span style="opacity:.6;font-size:11px;">(${toFa(l.length)})</span></h2>${l.map(card).join('')}</div>` : ''; };
    box.innerHTML = (TAB === 'awaiting' && APPT_HINT ? `<div class="appt-hint">🗓 ${esc(APPT_HINT)}</div>` : '') + sec('THIRDPARTY', '🚦 بیمه ثالث') + sec('BODY', '🚘 بیمه بدنه');
    if (FOCUS_CASE) { const el = document.getElementById('case-' + FOCUS_CASE); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function docsUrl(caseId) { return `../visit/index_docs.html?t=${encodeURIComponent(TOKEN)}&case=${caseId}`; }
function goDocs(caseId) { location.href = docsUrl(caseId); }
async function goHealth(caseId) {
    try {
        const data = await (await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'start_health', token:TOKEN, mode:'case', case_id:caseId }) })).json();
        if (!data.ok) { if (data.closed) { HOURS = data.hours; renderClosed(); render(); } showToast(data.error); return; }
        location.href = `../bazdid/index_bazdid.html?t=${encodeURIComponent(data.health_token)}&return=visit&rt=${encodeURIComponent(TOKEN)}`;
    } catch(e) { showToast('خطا در اتصال به سرور.'); }
}

init();
</script>
</body>
</html>
