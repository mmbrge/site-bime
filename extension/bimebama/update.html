<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>بروزرسانی خودکار افزونه</title>
  <style>
    @font-face { font-family: 'vazir'; src: url('fonts/Vazir-Regular.woff2') format('woff2'); font-weight: normal; }
    @font-face { font-family: 'vazir'; src: url('fonts/Vazir-Bold.woff2') format('woff2'); font-weight: bold; }
    @font-face { font-family: 'vazir'; src: url('fonts/Vazir-Black.woff2') format('woff2'); font-weight: 900; }
    * { box-sizing: border-box; font-family: 'vazir', Tahoma, sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(circle at 85% 0%, rgba(250,204,21,.18), transparent 40%), linear-gradient(160deg, #eef2ff, #f1f5f9 60%); color: #0f172a; }
    .card { width: 460px; max-width: 92vw; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px;
            padding: 28px; box-shadow: 0 24px 50px -24px rgba(15,23,42,.45); animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
    h1 { font-size: 17px; font-weight: 900; margin: 0 0 6px; color: #1e3a8a; }
    .sub { color: #64748b; font-size: 12.5px; margin-bottom: 18px; line-height: 1.9; }
    .bar { height: 10px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin: 14px 0 8px; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, #0284c7, #10b981); border-radius: 8px; transition: width .3s; }
    .step { font-size: 12.5px; color: #334155; min-height: 20px; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 10px; font-weight: bold; font-size: 13.5px; cursor: pointer;
           background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; margin-top: 12px; border-radius: 14px; box-shadow: 0 10px 22px -12px rgba(37,99,235,.8); }
    .btn:disabled { opacity: .5; cursor: default; }
    .err { color: #b91c1c; font-size: 12.5px; margin-top: 10px; line-height: 1.9; display: none; }
    .done { display: none; text-align: center; padding: 6px 0; }
    .done.show { display: block; }
    .check { width: 84px; height: 84px; margin: 4px auto 10px; }
    .check circle { stroke: #10b981; stroke-width: 4; fill: none; stroke-dasharray: 252; stroke-dashoffset: 252; animation: draw .7s ease-out forwards; }
    .check path { stroke: #10b981; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s .6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .hint { font-size: 11.5px; color: #94a3b8; margin-top: 14px; line-height: 1.9; }
  </style>
</head>
<body>
  <div class="card">
    <div id="workView">
      <h1>بروزرسانی خودکار افزونه</h1>
      <div class="sub" id="verInfo">در حال بررسی...</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="step" id="step">آماده شروع</div>
      <div class="err" id="err"></div>
      <button class="btn" id="startBtn">شروع بروزرسانی</button>
      <button class="btn" id="setupBtn" style="background:#1e293b;border:1px solid #334155;">تنظیم اولیه: اتصال به پوشه افزونه (فقط یک‌بار)</button>
      <div class="step" id="setupMsg" style="margin-top:8px;"></div>
      <div class="hint" id="hint">اولین بار، مرورگر یک‌بار از شما می‌خواهد پوشه نصب‌شده خود افزونه را انتخاب کنید (همان پوشه‌ای که در Load unpacked انتخاب کرده‌اید) و اجازه نوشتن بدهید. دفعات بعد فقط یک تأیید ساده لازم است.</div>
    </div>
    <div class="done" id="doneView">
      <svg class="check" viewBox="0 0 88 88"><circle cx="44" cy="44" r="40"/><path d="M26 45 L39 58 L63 32"/></svg>
      <h1 style="color:#34d399">بروزرسانی انجام شد</h1>
      <div class="sub" id="doneInfo"></div>
    </div>
  </div>
  <script src="lib/jszip.min.js"></script>
  <script src="update.js"></script>
</body>
</html>
